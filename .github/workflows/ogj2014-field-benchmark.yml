name: OGJ2014 Field-Level ML Benchmark

on:
  push:
    branches:
      - fix/openglobus-restore-after-revert
    paths:
      - "src/notebooks/ml_data/OGJ2014_extracted_vs_Table1.xlsx"
      - "scripts/audit_ogj2014_grouped_splits.py"
      - "scripts/audit_ogj2014_data_quality.py"
      - "scripts/benchmark_ogj2014_field_generalization.py"
      - "tests/test_ogj2014_field_overrides.py"
      - "tests/test_ogj2014_field_benchmark.py"
      - "tests/test_ogj2014_field_overrides.py"
      - "tests/test_ogj2014_field_benchmark.py"
      - ".github/workflows/ogj2014-field-benchmark.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/notebooks/ml_data/OGJ2014_extracted_vs_Table1.xlsx"
      - "scripts/audit_ogj2014_grouped_splits.py"
      - "scripts/benchmark_ogj2014_field_generalization.py"
      - "scripts/audit_ogj2014_data_quality.py"
      - "tests/test_ogj2014_field_overrides.py"
      - "tests/test_ogj2014_field_benchmark.py"

concurrency:
  group: ogj2014-field-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  field-level-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install pandas numpy scikit-learn openpyxl pytest catboost

      - name: Test field overrides and source-section conflict policy
        run: pytest -q tests/test_ogj2014_field_overrides.py tests/test_ogj2014_field_benchmark.py

      - name: Audit provenance and class support
        run: python scripts/audit_ogj2014_grouped_splits.py

      - name: Audit unresolved fields, aliases, features, and labels
        run: python scripts/audit_ogj2014_data_quality.py

      - name: Run row-preserving field-level baseline benchmark
        run: python scripts/benchmark_ogj2014_field_generalization.py

      # Preserve the support audit even if model splitting/training fails.
      - name: Upload audit and benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogj2014-field-level-ml-reports
          path: |
            outputs/ml_research/ogj2014_grouped_split_audit.json
            outputs/ml_research/ogj2014_field_generalization_benchmark.json
            outputs/ml_research/ogj2014_field_generalization_model_comparison.csv
            outputs/ml_research/ogj2014_repeated_holdout_model_comparison.csv
            outputs/ml_research/ogj2014_data_quality_audit.json
            outputs/ml_research/ogj2014_unresolved_field_review.csv
            outputs/ml_research/ogj2014_field_alias_review.csv
            outputs/ml_research/ogj2014_feature_range_issues.csv
            outputs/ml_research/ogj2014_technique_label_audit.csv
            outputs/ml_research/ogj2014_class_support_remediation.csv
            outputs/ml_research/ogj2014_technique_label_semantic_review.csv
            outputs/ml_research/ogj2014_source_section_label_conflicts.csv
          if-no-files-found: warn
