name: EOR Atlas Hybrid Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-hybrid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pandas==2.2.3" "pytest==8.3.4"

      - name: Compile hybrid modules
        run: |
          python -m py_compile \
            src/ml/hybrid_intelligence.py \
            src/ml/hybrid_feature_builder.py \
            src/ml/train_hybrid_catboost.py \
            src/hybrid_app.py

      - name: Run hybrid unit tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_hybrid_intelligence.py
