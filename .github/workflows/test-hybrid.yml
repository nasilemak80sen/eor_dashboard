name: EOR Atlas Hybrid Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-hybrid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pandas==2.2.3" "scikit-learn==1.6.1" "pytest==8.3.4"

      - name: Compile production and hybrid modules
        run: |
          python -m py_compile \
            src/app_2.py \
            src/hybrid_app.py \
            src/ml/hybrid_intelligence.py \
            src/ml/hybrid_feature_builder.py \
            src/ml/hybrid_model_assessment.py \
            src/ml/train_hybrid_catboost.py

      - name: Run hybrid regression tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_hybrid_intelligence.py tests/test_hybrid_feature_builder.py tests/test_hybrid_model_assessment.py
