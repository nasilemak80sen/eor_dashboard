name: EOR Atlas live Vue + FastAPI end-to-end

on:
  push:
    branches:
      - feat/vue-migration-phases-0-4
  pull_request:
    branches:
      - fix/openglobus-restore-after-revert
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/vue-migration-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  EOR_ENV: development
  EOR_OIDC_ISSUER: http://127.0.0.1:8081/
  EOR_OIDC_AUDIENCE: eor-atlas-e2e
  EOR_OIDC_JWKS_URL: http://127.0.0.1:8081/jwks
  EOR_OIDC_REQUIRED_SCOPE: eor.atlas.access
  EOR_ALLOWED_ORIGINS: http://127.0.0.1:5173
  EOR_FRONTEND_URL: http://127.0.0.1:5173
  EOR_API_URL: http://127.0.0.1:8000
  EOR_TEST_OIDC_URL: http://127.0.0.1:8081
  EOR_APPROVED_EXPECTED_PATH: /tmp/eor-approved-legacy-results.json

jobs:
  live-browser-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python application and API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e "backend[test]"
      - name: Export legacy expectations for approved-case parity (if supplied)
        run: python tests/e2e_support/export_legacy_parity.py --output /tmp/eor-approved-legacy-results.json
      - name: Install frontend and browser-test dependencies
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start ephemeral OIDC issuer, FastAPI and Vue dev server
        run: |
          nohup python tests/e2e_support/mock_oidc.py >/tmp/eor-oidc.log 2>&1 &
          echo $! >/tmp/eor-oidc.pid
          nohup python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 >/tmp/eor-api.log 2>&1 &
          echo $! >/tmp/eor-api.pid
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/eor-vue.log 2>&1 &
          echo $! >/tmp/eor-vue.pid
          cd ..
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null &&
               curl -fsS http://127.0.0.1:8000/api/v1/health/live >/dev/null &&
               curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo "OIDC fixture, FastAPI and Vue server are responding."
              exit 0
            fi
            sleep 2
          done
          echo "One or more services failed to start."
          cat /tmp/eor-oidc.log || true
          cat /tmp/eor-api.log || true
          cat /tmp/eor-vue.log || true
          exit 1
      - name: Run authenticated real-backend browser smoke
        working-directory: frontend
        run: npm run test:e2e
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "===== OIDC fixture ====="
          cat /tmp/eor-oidc.log || true
          echo "===== FastAPI ====="
          cat /tmp/eor-api.log || true
          echo "===== Vue dev server ====="
          cat /tmp/eor-vue.log || true