name: EOR Atlas UIUX Validation

on:
  push:
    branches:
      - feat/eor-atlas-uiux-foundation
  pull_request:
    branches:
      - fix/rd-lab-evidence-stabilization
      - main

permissions:
  contents: read

concurrency:
  group: eor-atlas-uiux-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-and-runtime:
    name: Regression, imports and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Compile application, scripts and tests
        run: python -m compileall -q src scripts tests

      - name: Import production entrypoint and all UI workspaces
        env:
          PYTHONPATH: .:src
        run: |
          python -c "import eor_atlas; import hybrid_app; import data.screening_history; import data.historical_studies; import data.challenges; import data.ceor_evidence; import data.rd_lab_evidence; import data.baronia_wag_evidence; import ui.openglobus; import ui.theme; import ui.components; import ui.navigation; import ui.app_shell; import pages_ui.overview; import pages_ui.candidates; import pages_ui.screening; import pages_ui.intelligence; import pages_ui.insights; import pages_ui.historical; import pages_ui.ceor; import pages_ui.rd; import pages_ui.challenges; import pages_ui.system"

      - name: Run complete repository pytest suite without exclusions
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p reports
          pytest -q tests src/tests --junitxml=reports/pytest-results.xml

      - name: Start Streamlit and verify HTTP health
        env:
          PYTHONPATH: .:src
        run: |
          set -euo pipefail
          streamlit run src/eor_atlas.py --server.headless true --server.port 8501 --server.address 127.0.0.1 > /tmp/eor-atlas-streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          health_url = "http://127.0.0.1:8501/_stcore/health"
          app_url = "http://127.0.0.1:8501/"
          last_error = None

          for _ in range(60):
              try:
                  with urllib.request.urlopen(health_url, timeout=2) as response:
                      if response.status != 200:
                          raise RuntimeError(f"Streamlit health returned HTTP {response.status}")
                  with urllib.request.urlopen(app_url, timeout=5) as response:
                      if response.status != 200:
                          raise RuntimeError(f"Streamlit app returned HTTP {response.status}")
                  print("Streamlit health and application endpoints returned HTTP 200.")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise RuntimeError(f"Streamlit failed to become healthy: {last_error}")
          PY

      - name: Upload pytest report and Streamlit startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eor-atlas-uiux-validation-${{ github.run_id }}
          path: |
            reports/pytest-results.xml
            /tmp/eor-atlas-streamlit.log
          if-no-files-found: warn
