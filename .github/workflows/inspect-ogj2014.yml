name: Inspect OGJ2014 workbook

on:
  push:
    branches:
      - data/ogj2014-provenance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pandas
      - run: python scripts/inspect_ogj2014.py
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogj2014-inspection
          path: work/ogj2014_inspection.json
          if-no-files-found: error
