name: Build OGJ2014 provenance dataset

on:
  push:
    branches:
      - data/ogj2014-provenance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/build_ogj2014_provenance.py
      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ogj2014-provenance-deliverables
          path: work/ogj2014_provenance/
          if-no-files-found: error
