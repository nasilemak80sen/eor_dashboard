name: Inspect OGJ2014 workbook

on:
  push:
    branches:
      - data/ogj2014-provenance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pandas
      - run: python scripts/inspect_ogj2014.py
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/ogj2014_inspection.json
          git diff --cached --quiet || git commit -m "chore: inspect OGJ2014 workbook provenance sources"
          git push

# inspection workflow v2
