name: Build OGJ2014 provenance workbooks

on:
  push:
    branches:
      - fix/openglobus-restore-after-revert
    paths:
      - "scripts/build_ogj2014_provenance.py"
      - ".github/workflows/inspect-ogj2014.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependency
        run: python -m pip install openpyxl

      - name: Verify source copies and build provenance metadata
        run: python scripts/build_ogj2014_provenance.py

      - name: Publish both validated workbook copies
        run: |
          cp work/ogj2014_provenance/OGJ2014_extracted_vs_Table1_provenance.xlsx src/notebooks/ml_data/OGJ2014_extracted_vs_Table1.xlsx
          cp work/ogj2014_provenance/OGJ2014_extracted_vs_Table1_provenance_mirror.xlsx data/OGJ2014_extracted_vs_Table1.xlsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/notebooks/ml_data/OGJ2014_extracted_vs_Table1.xlsx data/OGJ2014_extracted_vs_Table1.xlsx
          if git diff --cached --quiet; then
            echo "Validated workbooks already match the generated provenance data."
            exit 0
          fi
          git commit -m "data: add OGJ2014 provenance IDs to Excel workbooks"
          git push origin HEAD:fix/openglobus-restore-after-revert

      - name: Upload audit and mapping deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogj2014-provenance-build
          path: work/ogj2014_provenance/
          if-no-files-found: warn
