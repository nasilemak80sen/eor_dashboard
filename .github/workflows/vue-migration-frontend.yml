name: Vue migration frontend build
on:
  push:
    branches: [feat/vue-migration-phases-0-4]
  pull_request:
    branches: [fix/openglobus-restore-after-revert, main]
    paths: ["frontend/**", "docs/vue-migration/**", ".github/workflows/vue-migration-frontend.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
