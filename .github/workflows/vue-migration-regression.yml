name: EOR Atlas migration regression

on:
  push:
    branches:
      - feat/vue-migration-phases-0-4
  pull_request:
    branches:
      - fix/openglobus-restore-after-revert
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "backend/**"
      - ".github/workflows/vue-migration-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install existing application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install FastAPI parity-test dependencies
        run: python -m pip install -e "backend[test]"
      - name: Compile existing engine and UI modules
        run: |
          python -m py_compile \
            src/app_2.py \
            src/hybrid_app.py \
            src/eor_atlas.py \
            src/data/screening_history.py \
            src/data/historical_studies.py \
            src/ui/openglobus.py \
            src/ml/hybrid_intelligence.py \
            src/ml/hybrid_feature_builder.py
      - name: Run existing engineering, history and UI regression tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_hybrid_intelligence.py \
            tests/test_hybrid_feature_builder.py \
            tests/test_screening_history.py \
            tests/test_historical_studies.py \
            tests/test_database_migration.py \
            tests/test_openglobus.py \
            tests/test_ui_shell.py \
            tests/test_vue_phase2_parity.py
